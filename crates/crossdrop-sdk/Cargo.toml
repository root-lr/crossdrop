[package]
name = "crossdrop-sdk"
description = "Client SDK for the crossdrop daemon: build CLIs, apps and extensions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["crossdrop", "sdk", "p2p", "ipc", "extension"]
categories = ["network-programming", "api-bindings"]

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
crossdrop-proto = { version = "0.4.1", path = "../crossdrop-proto" }
dirs = "7.0.0"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }

[dev-dependencies]
tempfile = "3.27.0"
