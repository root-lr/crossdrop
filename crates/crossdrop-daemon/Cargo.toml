[package]
name = "crossdrop-daemon"
description = "The crossdrop daemon (crossdropd)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["crossdrop", "file-transfer", "clipboard", "p2p", "daemon"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
crossdrop-core = { version = "0.4.1", path = "../crossdrop-core" }
crossdrop-proto = { version = "0.4.1", path = "../crossdrop-proto" }
crossdrop-sdk = { version = "0.4.1", path = "../crossdrop-sdk" }
dirs = "7.0.0"
gethostname = "1.1.0"
getrandom = "0.4.3"
png = "0.18.1"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full", "test-util"] }

[[bin]]
name = "crossdropd"
path = "src/main.rs"

# Detecting clipboard contents that password managers mark as sensitive.
# Already built for arboard; listed here to call them directly.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSEnumerator"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "5.4.3", features = ["std"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
