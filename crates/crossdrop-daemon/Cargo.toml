[package]
name = "crossdrop-daemon"
description = "The crossdrop daemon (crossdropd)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.7.0", default-features = false }
blake3 = "1.8.7"
crossdrop-core = { version = "0.4.0", path = "../crossdrop-core" }
crossdrop-proto = { version = "0.4.0", path = "../crossdrop-proto" }
crossdrop-sdk = { version = "0.4.0", path = "../crossdrop-sdk" }
dirs = "7.0.0"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "crossdropd"
path = "src/main.rs"
