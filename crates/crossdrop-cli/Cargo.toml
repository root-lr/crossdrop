[package]
name = "crossdrop-cli"
description = "crossdrop command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossdrop-daemon = { version = "0.4.0", path = "../crossdrop-daemon" }
crossdrop-proto = { version = "0.4.0", path = "../crossdrop-proto" }
crossdrop-sdk = { version = "0.4.0", path = "../crossdrop-sdk" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[[bin]]
name = "crossdrop"
path = "src/main.rs"
