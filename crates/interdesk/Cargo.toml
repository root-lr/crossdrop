[package]
description = "Share one mouse and keyboard across your computers, built on crossdrop"
name = "interdesk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5.61", features = ["derive"] }
crossdrop-proto = { version = "0.4.0", path = "../crossdrop-proto" }
crossdrop-sdk = { version = "0.4.0", path = "../crossdrop-sdk" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.0.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = { version = "0.14.0", features = ["xtest"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-graphics = { version = "0.25.0", features = ["highsierra"] }

[dev-dependencies]
crossdrop-daemon = { path = "../crossdrop-daemon" }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["full", "test-util"] }

[[bin]]
name = "interdesk"
path = "src/main.rs"
