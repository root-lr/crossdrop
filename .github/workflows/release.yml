name: Release

# From the Actions tab: "Run workflow", with the version to release.
# The tag is created on the commit the workflow runs on, when the draft
# release is published. There is no tag trigger on purpose: publishing the
# draft pushes the tag, and a second run would rebuild and overwrite the
# assets of the published release, after Homebrew has hashed them.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to create, e.g. v0.4.0
        required: true
        default: v0.4.0

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  prepare:
    name: Start a fresh draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The tag names the release; the binaries print the versions declared
      # in the manifests. Refuse to build if they disagree.
      - name: Check that the tag matches the declared versions
        run: |
          want="${VERSION#v}"
          bad=0
          check() {
            if [ "$2" != "$want" ]; then
              echo "::error file=$1::$1 declares version $2, the tag is $VERSION"
              bad=1
            fi
          }
          check Cargo.toml "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          check apps/desktop/src-tauri/Cargo.toml "$(sed -n 's/^version = "\(.*\)"/\1/p' apps/desktop/src-tauri/Cargo.toml | head -1)"
          check apps/desktop/src-tauri/tauri.conf.json "$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
          check apps/desktop/package.json "$(jq -r .version apps/desktop/package.json)"
          exit $bad
      - name: Remove an earlier draft of this version
        run: |
          ids=$(gh api "repos/${{ github.repository }}/releases" \
            --jq ".[] | select(.draft and .tag_name == \"$VERSION\") | .id")
          for id in $ids; do
            echo "deleting draft $id"
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
          done

  build:
    name: ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            archive: tar.gz
            tauri_args: ""
          # Raspberry Pi, ARM servers and laptops.
          - name: Linux (ARM64)
            os: ubuntu-22.04-arm
            archive: tar.gz
            tauri_args: ""
          # One universal build for Apple silicon and Intel Macs.
          - name: macOS (universal)
            os: macos-latest
            archive: tar.gz
            tauri_args: --target universal-apple-darwin
          - name: Windows
            os: windows-latest
            archive: zip
            tauri_args: ""
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            apps/desktop/src-tauri
      - name: WebView libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
        working-directory: apps/desktop

      # Desktop app installers (.dmg, .msi/.exe, .deb/.rpm/.AppImage) on a draft release.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          projectPath: apps/desktop
          tagName: ${{ env.VERSION }}
          releaseName: crossdrop ${{ env.VERSION }}
          releaseBody: |
            Desktop app: the installer for your system below.
            Command line (crossdrop, crossdropd, interdesk): the `crossdrop-cli-*` archive, or Homebrew:
            ```
            brew tap root-lr/crossdrop https://github.com/root-lr/crossdrop
            brew trust root-lr/crossdrop
            brew install crossdrop
            brew install --cask crossdrop-app
            ```
          releaseDraft: true
          releaseCommitish: ${{ github.sha }}
          args: ${{ matrix.tauri_args }}

      # Command-line tools: crossdrop, crossdropd, interdesk.
      - name: Build and upload the command-line tools
        shell: bash
        run: |
          bins="crossdrop crossdropd interdesk"
          pkgs="-p crossdrop-cli -p crossdrop-daemon -p interdesk"
          if [ "$RUNNER_OS" = macOS ]; then
            triple=universal-apple-darwin
            out=target/universal
            mkdir -p "$out"
            for t in aarch64-apple-darwin x86_64-apple-darwin; do
              cargo build --release --target "$t" $pkgs
            done
            for b in $bins; do
              lipo -create -output "$out/$b" \
                "target/aarch64-apple-darwin/release/$b" "target/x86_64-apple-darwin/release/$b"
            done
            lipo -info "$out/crossdrop"
          else
            triple=$(rustc -vV | sed -n 's/host: //p')
            out=target/release
            cargo build --release $pkgs
          fi
          ext=$([ "$RUNNER_OS" = Windows ] && echo .exe || true)
          name="crossdrop-cli-$VERSION-$triple"
          mkdir "$name"
          for b in $bins; do cp "$out/$b$ext" "$name/"; done
          cp README.md LICENSE-MIT LICENSE-APACHE "$name/"
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a "$name.zip" "$name" >/dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          gh release upload "$VERSION" "$name.${{ matrix.archive }}" --clobber

  checksums:
    name: Checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      # One SHA256SUMS for every file of the release, installers included,
      # so that a download can be checked with `sha256sum -c SHA256SUMS`.
      - name: Hash the release assets
        run: |
          # The release is still a draft, which `gh release download` cannot
          # see: find it by tag and fetch its assets by id.
          repo="${{ github.repository }}"
          id=$(gh api "repos/$repo/releases" --jq ".[] | select(.tag_name == \"$VERSION\") | .id" | head -1)
          mkdir assets && cd assets
          gh api "repos/$repo/releases/$id/assets" --paginate --jq '.[] | "\(.id) \(.name)"' |
            while read -r asset name; do
              [ "$name" = SHA256SUMS ] && continue
              gh api -H "Accept: application/octet-stream" "repos/$repo/releases/assets/$asset" > "$name"
            done
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$VERSION" SHA256SUMS --repo "$repo" --clobber
