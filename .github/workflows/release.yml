name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            archive: tar.gz
          - os: macos-latest
            archive: tar.gz
          - os: windows-latest
            archive: zip
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri
      - name: WebView libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
        working-directory: apps/desktop

      # Desktop app installers (.dmg, .msi/.exe, .deb/.AppImage) on a draft release.
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: crossdrop ${{ github.ref_name }}
          releaseBody: See the README for what changed and how to install.
          releaseDraft: true

      # Command-line tools: crossdrop, crossdropd, interdesk.
      - run: cargo build --release -p crossdrop-cli -p crossdrop-daemon -p interdesk
      - name: Package the command-line tools
        shell: bash
        run: |
          name=crossdrop-cli-${{ github.ref_name }}-$(rustc -vV | sed -n 's/host: //p')
          mkdir "$name"
          for bin in crossdrop crossdropd interdesk; do
            cp "target/release/$bin$([ "$RUNNER_OS" = Windows ] && echo .exe)" "$name/"
          done
          cp README.md LICENSE-MIT LICENSE-APACHE "$name/"
          if [ "${{ matrix.archive }}" = zip ]; then 7z a "$name.zip" "$name" >/dev/null; else tar czf "$name.tar.gz" "$name"; fi
          gh release upload "${{ github.ref_name }}" "$name.${{ matrix.archive }}" --clobber
