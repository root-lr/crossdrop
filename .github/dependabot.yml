# Weekly dependency updates, one grouped pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/apps/desktop/src-tauri"]
    schedule:
      interval: weekly
    ignore:
      # 0.14 needs Rust 1.89 (rust-version is 1.88) and changes the device
      # types interdesk's Wayland code uses. Drop this when raising it.
      - dependency-name: ashpd
        versions: [">= 0.14"]
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Its refs name Rust toolchains (stable, 1.88), not releases of the action.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions:
        patterns: ["*"]
